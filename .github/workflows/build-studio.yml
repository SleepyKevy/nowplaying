name: Build Sleepy Now Playing Studio

on:
  workflow_dispatch:
  push:
    paths:
      - 'studio/**'
      - '.github/workflows/build-studio.yml'

jobs:
  build-studio-windows:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: false

      - name: Use preinstalled MinGW GCC for Windows SMTC
        shell: pwsh
        run: |
          $candidates = @(
            'C:\mingw64\bin\gcc.exe',
            'C:\msys64\mingw64\bin\gcc.exe',
            'C:\msys64\ucrt64\bin\gcc.exe'
          )
          $gccPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $gccPath) {
            $cmd = Get-Command gcc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $gccPath = $cmd.Source }
          }
          if (-not $gccPath) { throw 'Preinstalled MinGW GCC was not found on the GitHub Windows runner.' }
          $gccDir = Split-Path -Parent $gccPath
          "CC=$gccPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $gccDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using GCC: $gccPath"
          & $gccPath --version

      - name: Reconstruct and extract Studio source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force './studio-build' | Out-Null
          $parts = 0..3 | ForEach-Object {
            $path = './studio/source.part.' + $_.ToString('00')
            if (-not (Test-Path $path)) { throw "Missing source chunk: $path" }
            [System.IO.File]::ReadAllText($path).Trim()
          }
          $base64 = [string]::Concat($parts)
          if ($base64.Length -ne 25472) { throw "Unexpected encoded source length: $($base64.Length)" }
          $bytes = [System.Convert]::FromBase64String($base64)
          if ($bytes.Length -ne 19103) { throw "Unexpected source ZIP size: $($bytes.Length)" }
          [System.IO.File]::WriteAllBytes('./SleepyNowPlaying_Studio_Source_REAL.zip', $bytes)
          $hash = (Get-FileHash './SleepyNowPlaying_Studio_Source_REAL.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'fcb6841469d512a6c49f7f8b072f66731223ff1f7e0189e00252ef186100f2d7') {
            throw "Source ZIP checksum mismatch: $hash"
          }
          Write-Host "Source ZIP verified: $hash"
          Expand-Archive -Path './SleepyNowPlaying_Studio_Source_REAL.zip' -DestinationPath './studio-build' -Force
          Get-ChildItem './studio-build'

      - name: Resolve Go modules
        shell: pwsh
        working-directory: ./studio-build
        env:
          CGO_ENABLED: '1'
        run: |
          go mod tidy
          go mod verify

      - name: Build portable Windows app
        shell: pwsh
        working-directory: ./studio-build
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force './dist/SleepyNowPlaying' | Out-Null
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o './dist/SleepyNowPlaying/SleepyNowPlaying.exe' .
          Copy-Item './README.md' './dist/SleepyNowPlaying/README.md' -Force

      - name: Package portable ZIP
        shell: pwsh
        working-directory: ./studio-build
        run: |
          Compress-Archive -Path './dist/SleepyNowPlaying/*' -DestinationPath './SleepyNowPlaying-Windows-x64-v0.1.0.zip' -Force
          Get-Item './SleepyNowPlaying-Windows-x64-v0.1.0.zip' | Format-List Name,Length

      - name: Upload Sleepy Now Playing Studio
        uses: actions/upload-artifact@v4
        with:
          name: SleepyNowPlaying-Windows-x64-v0.1.0
          path: studio-build/SleepyNowPlaying-Windows-x64-v0.1.0.zip
          if-no-files-found: error
