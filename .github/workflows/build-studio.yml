name: Build Sleepy Now Playing Studio

on:
  workflow_dispatch:
  push:
    paths:
      - 'studio/**'
      - '.github/workflows/build-studio.yml'

jobs:
  build-studio-windows:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: false

      - name: Use preinstalled MinGW GCC for Windows SMTC
        shell: pwsh
        run: |
          $candidates = @(
            'C:\msys64\mingw64\bin\gcc.exe',
            'C:\msys64\ucrt64\bin\gcc.exe'
          )
          $gccPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $gccPath) {
            $cmd = Get-Command gcc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $gccPath = $cmd.Source }
          }
          if (-not $gccPath) { throw 'Preinstalled MinGW GCC was not found on the GitHub Windows runner.' }
          $gccDir = Split-Path -Parent $gccPath
          "CC=$gccPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $gccDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using GCC: $gccPath"
          & $gccPath --version

      - name: Extract Studio source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force './studio-build' | Out-Null
          Expand-Archive -Path './studio/SleepyNowPlaying_Studio_Source.zip' -DestinationPath './studio-build' -Force

      - name: Resolve Go modules
        shell: pwsh
        working-directory: ./studio-build
        env:
          CGO_ENABLED: '1'
        run: |
          go mod tidy
          go mod verify

      - name: Build portable Windows app
        shell: pwsh
        working-directory: ./studio-build
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force './dist/SleepyNowPlaying' | Out-Null
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o './dist/SleepyNowPlaying/SleepyNowPlaying.exe' .
          Copy-Item './README.md' './dist/SleepyNowPlaying/README.md' -Force

      - name: Package portable ZIP
        shell: pwsh
        working-directory: ./studio-build
        run: |
          Compress-Archive -Path './dist/SleepyNowPlaying/*' -DestinationPath './SleepyNowPlaying-Windows-x64-v0.1.0.zip' -Force
          Get-Item './SleepyNowPlaying-Windows-x64-v0.1.0.zip' | Format-List Name,Length

      - name: Upload Sleepy Now Playing Studio
        uses: actions/upload-artifact@v4
        with:
          name: SleepyNowPlaying-Windows-x64-v0.1.0
          path: studio-build/SleepyNowPlaying-Windows-x64-v0.1.0.zip
          if-no-files-found: error
