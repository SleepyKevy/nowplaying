name: Build OBS Now Playing

on:
  workflow_dispatch:
  push:
    paths:
      - 'OBS_Now_Playing_Complete_v1.0.0_BUILD_TOOLS_ONLY.zip'
      - 'overrides/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract plugin source
        shell: pwsh
        run: |
          Expand-Archive -Path './OBS_Now_Playing_Complete_v1.0.0_BUILD_TOOLS_ONLY.zip' -DestinationPath './source' -Force

      - name: Apply Windows media session backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force './source/src/windows' | Out-Null
          Copy-Item './overrides/CMakeLists.txt' './source/CMakeLists.txt' -Force
          Copy-Item './overrides/src/plugin-main.cpp' './source/src/plugin-main.cpp' -Force
          Copy-Item './overrides/src/windows/windows-media-playback-provider.hpp' './source/src/windows/windows-media-playback-provider.hpp' -Force
          Copy-Item './overrides/src/windows/windows-media-playback-provider.cpp' './source/src/windows/windows-media-playback-provider.cpp' -Force

          $rendererPath = './source/src/render/card-renderer.cpp'
          $renderer = Get-Content -Raw $rendererPath
          $renderer = $renderer.Replace('Spotify not connected', 'Spotify Desktop not detected')
          $renderer = $renderer.Replace('Connect Spotify from the OBS Tools menu', 'Start Spotify Desktop and play something')
          Set-Content -Path $rendererPath -Value $renderer -Encoding utf8NoBOM -NoNewline

          $localePath = './source/data/locale/en-US.ini'
          $locale = Get-Content -Raw $localePath
          $oldNotice = 'Connect Spotify from Tools > Now Playing: Spotify Connection. Customize this source here; enable Preview with sample song to design it while Spotify is idle.'
          $newNotice = 'Uses Spotify Desktop through Windows Media Sessions. No Spotify Premium, Client ID, browser login, or redirect URI is required. Start Spotify Desktop and play something; use Preview with sample song while idle.'
          $locale = $locale.Replace($oldNotice, $newNotice)
          $locale = $locale.Replace('Spotify not connected', 'Spotify Desktop not detected')
          Set-Content -Path $localePath -Value $locale -Encoding utf8NoBOM -NoNewline

      - name: Apply smooth progress and transparency controls
        shell: pwsh
        run: |
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          $targets = @(
            './source/src/render/render-config.hpp',
            './source/src/render/card-renderer.cpp',
            './source/src/obs/now-playing-source.cpp',
            './source/data/locale/en-US.ini'
          )
          foreach ($target in $targets) {
            $text = [System.IO.File]::ReadAllText($target).Replace("`r`n", "`n")
            [System.IO.File]::WriteAllText($target, $text, $utf8NoBom)
          }
          git apply --directory=source --ignore-space-change --ignore-whitespace ./overrides/smooth-ui.patch

      - name: Validate project
        shell: pwsh
        working-directory: ./source
        run: python tests/validate-project.py

      - name: Build and package plugin
        shell: pwsh
        working-directory: ./source
        run: ./BUILD_WINDOWS.ps1 -Configuration RelWithDebInfo

      - name: Upload compiled OBS plugin
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Now-Playing-1.0.0-Windows-x64-GSMTC-Smooth
          path: source/build_x64/OBS-Now-Playing-1.0.0-Windows-x64.zip
          if-no-files-found: error
